<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VinUni Room Finder</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #22263a;
      --border:    #2e3250;
      --accent:    #6c63ff;
      --accent2:   #00d4aa;
      --user-bg:   #6c63ff;
      --bot-bg:    #1e2235;
      --step-bg:   #12151f;
      --text:      #e8eaf6;
      --text-dim:  #7b82a8;
      --red:       #ff5c5c;
      --yellow:    #ffd166;
      --green:     #06d6a0;
      --radius:    14px;
      --font:      'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.3px;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--text-dim);
    }

    .mode-btn.active {
      background: var(--accent);
      color: white;
    }

    .mode-btn:not(.active):hover {
      background: var(--border);
      color: var(--text);
    }

    /* ── Main layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* ── Message bubbles ── */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 780px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .avatar { background: var(--user-bg); }
    .msg.bot  .avatar { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.93rem;
      line-height: 1.6;
      max-width: 640px;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* ── Agent steps panel ── */
    .steps-panel {
      width: 340px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s;
    }

    .steps-panel.hidden { width: 0; border: none; }

    .steps-header {
      padding: 14px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .steps-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .steps-content::-webkit-scrollbar { width: 4px; }
    .steps-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .step-item {
      background: var(--step-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.5;
      animation: fadeUp 0.2s ease;
    }

    .step-item .step-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    .step-item.thought .step-label { color: var(--yellow); }
    .step-item.action  .step-label { color: var(--accent2); }
    .step-item.obs     .step-label { color: var(--green); }
    .step-item.loop    .step-label { color: var(--red); }
    .step-item.final   .step-label { color: var(--accent); }

    .step-item pre {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.78rem;
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 780px;
    }

    .input-wrap {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--accent); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.93rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    textarea::placeholder { color: var(--text-dim); }

    .send-btn {
      width: 42px; height: 42px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: #7c74ff; transform: scale(1.05); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }

    .send-btn svg { width: 18px; height: 18px; fill: white; }

    /* ── Suggestions ── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .suggestion {
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .suggestion:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(108, 99, 255, 0.1);
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 14px 16px;
    }

    .typing span {
      width: 7px; height: 7px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
      text-align: center;
      padding: 40px;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .empty-state h2 {
      font-size: 1.2rem;
      color: var(--text);
      font-weight: 600;
    }

    .empty-state p {
      font-size: 0.88rem;
      max-width: 320px;
      line-height: 1.6;
    }

    /* ── Mode badge ── */
    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    .mode-badge.chatbot { background: rgba(108,99,255,0.15); color: var(--accent); }
    .mode-badge.agent   { background: rgba(0,212,170,0.15);  color: var(--accent2); }

    /* ── Status dot ── */
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .steps-panel { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">🏫</div>
    VinUni Room Finder
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-chatbot" onclick="setMode('chatbot')">
      💬 Chatbot
    </button>
    <button class="mode-btn" id="btn-agent" onclick="setMode('agent')">
      🤖 ReAct Agent
    </button>
  </div>

  <div style="display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text-dim)">
    <div class="status-dot"></div>
    Phi-3 Local
  </div>
</header>

<!-- Main -->
<div class="main">

  <!-- Chat -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="icon">🏫</div>
        <h2>Tìm phòng học VinUni</h2>
        <p>Hỏi tôi về phòng học — sức chứa, tiện ích, thời gian trống. Tôi sẽ tìm phòng phù hợp nhất cho bạn.</p>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="suggestions" id="suggestions">
        <span class="suggestion" onclick="useSuggestion(this)">Phòng 30 người thứ 2 lúc 9h</span>
        <span class="suggestion" onclick="useSuggestion(this)">Phòng lab máy tính 40 người</span>
        <span class="suggestion" onclick="useSuggestion(this)">Phòng có máy chiếu và AC</span>
        <span class="suggestion" onclick="useSuggestion(this)">Phòng lớn nhất còn trống</span>
      </div>
      <div class="input-row">
        <div class="input-wrap">
          <textarea
            id="input"
            placeholder="Nhập yêu cầu phòng học..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Steps panel (agent mode) -->
  <div class="steps-panel hidden" id="steps-panel">
    <div class="steps-header">
      <span>ReAct Trace</span>
      <div class="status-dot" id="agent-status-dot" style="display:none"></div>
    </div>
    <div class="steps-content" id="steps-content"></div>
  </div>

</div>

<script>
  let mode = 'chatbot';
  let isLoading = false;

  // ── Mode switch ──────────────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('btn-chatbot').classList.toggle('active', m === 'chatbot');
    document.getElementById('btn-agent').classList.toggle('active', m === 'agent');
    document.getElementById('steps-panel').classList.toggle('hidden', m === 'chatbot');
  }

  // ── Auto-resize textarea ─────────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function useSuggestion(el) {
    const input = document.getElementById('input');
    input.value = el.textContent.trim();
    autoResize(input);
    sendMessage();
  }

  // ── Send ─────────────────────────────────────────────────────────────────
  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    document.getElementById('empty-state')?.remove();
    document.getElementById('suggestions').style.display = 'none';
    input.value = '';
    input.style.height = 'auto';

    appendMessage('user', text);
    setLoading(true);

    try {
      if (mode === 'chatbot') {
        await sendChatbot(text);
      } else {
        await sendAgent(text);
      }
    } finally {
      setLoading(false);
    }
  }

  // ── Chatbot ──────────────────────────────────────────────────────────────
  async function sendChatbot(text) {
    const typingId = appendTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping(typingId);
      appendMessage('bot', data.error ? '❌ ' + data.error : data.response, 'chatbot');
    } catch (e) {
      removeTyping(typingId);
      appendMessage('bot', '❌ Không kết nối được server: ' + e.message, 'chatbot');
    }
  }

  // ── Agent (fetch streaming) ───────────────────────────────────────────────
  async function sendAgent(text) {
    clearSteps();
    document.getElementById('agent-status-dot').style.display = 'block';
    const typingId = appendTyping();

    try {
      const res = await fetch('/agent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let gotFinal = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // giữ lại dòng chưa hoàn chỉnh

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const evt = JSON.parse(line.slice(6));
            if (evt.type === 'step') {
              appendStep(evt.content);
            } else if (evt.type === 'final') {
              removeTyping(typingId);
              appendMessage('bot', evt.content, 'agent');
              gotFinal = true;
            } else if (evt.type === 'error') {
              removeTyping(typingId);
              appendMessage('bot', '❌ ' + evt.content, 'agent');
              gotFinal = true;
            }
          } catch (_) {}
        }
      }

      if (!gotFinal) {
        removeTyping(typingId);
        appendMessage('bot', '⚠️ Agent kết thúc không có câu trả lời.', 'agent');
      }
    } catch (e) {
      removeTyping(typingId);
      appendMessage('bot', '❌ Lỗi kết nối: ' + e.message, 'agent');
    } finally {
      document.getElementById('agent-status-dot').style.display = 'none';
    }
  }

  // ── DOM helpers ──────────────────────────────────────────────────────────
  function appendMessage(role, text, modeLabel) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (modeLabel && role === 'bot') {
      const badge = document.createElement('div');
      badge.className = 'mode-badge ' + modeLabel;
      badge.textContent = modeLabel === 'chatbot' ? '💬 Chatbot' : '🤖 ReAct Agent';
      bubble.appendChild(badge);
    }

    const p = document.createElement('p');
    p.innerHTML = simpleMarkdown(text);
    bubble.appendChild(p);

    div.appendChild(avatar);
    div.appendChild(bubble);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendTyping() {
    const msgs = document.getElementById('messages');
    const id = 'typing-' + Date.now();
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = id;
    div.innerHTML = `<div class="avatar">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    document.getElementById(id)?.remove();
  }

  function setLoading(v) {
    isLoading = v;
    document.getElementById('send-btn').disabled = v;
    document.getElementById('input').disabled = v;
    if (!v) document.getElementById('input').focus();
  }

  function clearSteps() {
    document.getElementById('steps-content').innerHTML = '';
  }

  function appendStep(raw) {
    const content = document.getElementById('steps-content');
    const div = document.createElement('div');
    const lower = raw.toLowerCase();

    let cls = 'step-item', label = 'Output';
    if (lower.includes('--- step'))           { cls += ' thought'; label = '⚡ Step'; }
    else if (lower.includes('thought:'))      { cls += ' thought'; label = '💭 Thought'; }
    else if (lower.includes('action:'))       { cls += ' action';  label = '🔧 Action'; }
    else if (lower.includes('observation:'))  { cls += ' obs';     label = '👁 Observation'; }
    else if (lower.includes('[loop'))         { cls += ' loop';    label = '🔄 Loop'; }
    else if (lower.includes('final answer'))  { cls += ' final';   label = '✅ Final'; }

    div.className = cls;
    div.innerHTML = `<div class="step-label">${label}</div><pre>${escapeHtml(raw)}</pre>`;
    content.appendChild(div);
    content.scrollTop = content.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function simpleMarkdown(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')   // **bold**
      .replace(/\*(.+?)\*/g, '<em>$1</em>')               // *italic*
      .replace(/^- (.+)$/gm, '• $1')                      // - list item
      .replace(/\n/g, '<br>');                             // newlines
  }
</script>
</body>
</html>
